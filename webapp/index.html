<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>指数ビューア</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-title">
    <h1>指数ビューア</h1>
    <p>外部指数CSV（TARGET frontier取込形式）をフォルダから読み込んで一覧表にします</p>
  </div>
  <div class="topbar-actions">
    <button id="loadButton" class="primary">フォルダを選択して読み込み</button>
    <span id="loadStatus" class="status-text">未読み込み</span>
  </div>
</header>

<main>
  <section id="empty" class="empty-state">
    <p>「フォルダを選択して読み込み」を押して、指数CSV（または日次ZIP）が置かれているフォルダを指定してください。</p>
    <p class="hint">対応ブラウザ（Chrome / Edge）では次回以降フォルダ選択が省略され、ボタン1つで再読み込みできます。</p>
  </section>

  <section id="dashboard" hidden>
    <div class="tabs" role="tablist">
      <button id="tabRaces" class="tab active" role="tab" aria-selected="true">レース一覧</button>
      <button id="tabTable" class="tab" role="tab" aria-selected="false">指数テーブル</button>
    </div>

    <div id="raceView">
      <div class="toolbar">
        <div class="field">
          <label for="raceDateSelect">日付</label>
          <select id="raceDateSelect"></select>
        </div>
        <div class="field">
          <label for="racePlaceSelect">場所</label>
          <select id="racePlaceSelect"></select>
        </div>
        <div class="field">
          <label for="firmnessSelect">堅さ</label>
          <select id="firmnessSelect">
            <option value="">すべて</option>
            <option value="solid">堅そう</option>
            <option value="normal">標準</option>
            <option value="rough">荒れそう</option>
          </select>
        </div>
      </div>

      <div id="raceSummary" class="race-summary"></div>
      <div id="raceList" class="race-list"></div>
      <div id="raceEmpty" class="empty-state" hidden>該当するレースがありません。</div>
    </div>

    <div id="tableView" hidden>
    <div class="toolbar">
      <div class="field">
        <label for="dateSelect">日付</label>
        <select id="dateSelect"></select>
      </div>
      <div class="field">
        <label for="placeSelect">場所</label>
        <select id="placeSelect"></select>
      </div>
      <div class="field">
        <label for="raceSelect">R</label>
        <select id="raceSelect">
          <option value="">すべて</option>
        </select>
      </div>
      <div class="field">
        <label for="modeSelect">表示</label>
        <select id="modeSelect">
          <option value="both">値＋順位</option>
          <option value="value">値のみ</option>
          <option value="rank">順位のみ</option>
        </select>
      </div>
      <div class="field grow">
        <label for="searchInput">検索</label>
        <input id="searchInput" type="text" placeholder="馬番・値などで絞り込み" />
      </div>
      <div class="field">
        <button id="columnButton">指数を選択 <span id="columnCount" class="count-badge"></span></button>
        <div id="columnMenu" class="column-menu" hidden></div>
      </div>
      <div class="field">
        <button id="exportButton">CSV書き出し</button>
      </div>
      <div class="field">
        <label for="yearExportSelect">年ごと一括出力</label>
        <div class="year-export">
          <select id="yearExportSelect"></select>
          <button id="yearExportButton">書き出し</button>
        </div>
      </div>
    </div>

    <div id="stats" class="stats"></div>

    <div class="table-wrap">
      <table id="dataTable"></table>
    </div>
    <div id="tableEmpty" class="empty-state" hidden>該当するデータがありません。</div>
    </div>
  </section>

  <div id="toast" class="toast"></div>
</main>

<script src="app.js"></script>
</body>
</html>
